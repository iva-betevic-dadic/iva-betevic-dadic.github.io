<!DOCTYPE html>
<head>
    <title>manipulacija div elementa javascriptom</title>
</head>
<body>

    <div><img src="prva.jpg" alt="Prva slika" width="200"></div>
    <div id="slikaDva"><img src="druga.jpg" alt="Druga slika" width="200"></div>
    <div><img src="treca.jpg" alt="Treća slika" width="200"></div>

    <input type="button" value="Sakrij drugu sliku" onclick="window.document.getElementById('slikaDva').style.visibility='hidden';">
    <input type="button" value="Prikaži drugu sliku" onclick="window.document.getElementById('slikaDva').style.visibility='visible';">

</body>
</html>
