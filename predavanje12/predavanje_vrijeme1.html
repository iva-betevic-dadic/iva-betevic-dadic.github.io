<!doctype html>
<html>
<head>
<title>Primjer 1 - poruka nakon vremena</title>

<script language="javascript">

setTimeout("alert('Dobrodošli na moj primjer vremenski upravljanog prikaza.');", 2000);

</script>

</head>

<body>

<h1>Primjer 1 - vremenska poruka</h1>

<p>Ovo je moj prvi primjer rada s funkcijom setTimeout.</p> <br>
<p>Poruka se prikazuje dvije sekunde nakon otvaranja stranice.</p> <br>
<p>Na ovaj način se neka javascript naredba može izvršiti tek nakon zadanog vremena.</p> 

</body>
</html>
